<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My First Website</title>

<style>

body{
    background: linear-gradient(to right,#74ebd5,#ACB6E5);
    font-family: Arial;
    margin:0;
    padding:0;
}

.container{
    width:60%;
    margin:auto;
    background:white;
    padding:30px;
    margin-top:50px;
    border-radius:10px;
    text-align:center;
}

h1{
    color:#333;
}

img{
    width:250px;
    border-radius:10px;
}

ul{
    text-align:left;
    display:inline-block;
}

button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:5px;
    background:#3498db;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

input{
    padding:8px;
    border-radius:5px;
    border:1px solid #ccc;
}

#result{
    margin-top:15px;
    font-weight:bold;
}

a{
    color:#3498db;
}

</style>
</head>

<body>

<div class="container">

<h1>เว็บไซต์แนะนำการเรียนเขียนเว็บ</h1>

<img src="https://picsum.photos/300" alt="example">

<p>
เว็บไซต์นี้สร้างขึ้นเพื่อทดลองการเขียน HTML CSS และ JavaScript
สำหรับผู้เริ่มต้นพัฒนาเว็บไซต์
</p>

<h3>สิ่งที่ได้เรียนรู้</h3>

<ul>
<li>HTML โครงสร้างเว็บไซต์</li>
<li>CSS การตกแต่งหน้าเว็บ</li>
<li>JavaScript การโต้ตอบกับผู้ใช้</li>
</ul>

<p>
ศึกษาเพิ่มเติมได้ที่
<a href="https://www.w3schools.com" target="_blank">
W3Schools
</a>
</p>

<hr>

<button onclick="showWelcome()">แสดงข้อความต้อนรับ</button>

<br><br>

<input type="text" id="username" placeholder="กรอกชื่อของคุณ">

<button onclick="sayHello()">ทักทาย</button>

<p id="result"></p>

</div>

<script>

function showWelcome(){
alert("ยินดีต้อนรับสู่เว็บไซต์ของฉัน");
}

function sayHello(){
let name = document.getElementById("username").value;
document.getElementById("result").innerHTML =
"สวัสดี "+name+" ยินดีต้อนรับ";
}

</script>

</body>
</html>
